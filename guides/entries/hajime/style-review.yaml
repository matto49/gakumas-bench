# 初 · 好印象（ロジック）流派层。样板：协调 c8df260 11-20 派，先做好印象，审过再铺其余五个流派。
# 作用标签里 impression（攒好印象）、impression_cash（按好印象出分）是这次新提的词，待 3940a9 审。

- id: hajime.style-review.card_pick.stack
  kind: written
  scope: {mode: hajime, style: review}
  decision: card_pick
  content:
    prefer:
      - {id: p_card-02-men-2_056, role: impression, weight: 90, note: 止められない想い：好印象和やる気都给，还加使用数}
      - {id: p_card-02-men-2_058, role: impression, weight: 85, note: ファンシーチャーム：之后每打一张メンタル卡好印象 +1}
      - {id: p_card-02-men-2_101, role: impression, weight: 85, note: 冒険心：好印象 +6、加使用数、抽一张}
      - {id: p_card-02-men-3_042, role: impression, weight: 80, note: 虹色ドリーマー：好印象 ≥3 时每回合结束再 +3}
      - {id: p_card-02-men-3_004, role: impression, weight: 80, note: 星屑センセーション：好印象 ≥10 后好印象增加量 +50%}
      - {id: p_card-02-men-2_060, role: impression, weight: 75, note: オトメゴコロ}
      - {id: p_card-02-men-2_111, role: impression, weight: 75, note: 成長痛：好印象、やる気、元気一起给}
      - {id: p_card-02-men-2_050, role: impression, weight: 50, note: 幸せな時間：P 等级低时的替代}
    why: >-
      好印象流派靠回合结束时按好印象涨分，前半场先把好印象攒起来。优先拿一次给得多、
      或者之后每打一张卡还会继续加好印象的卡；带「使用数 +1」的更好，同一回合能多打一张。
      P 等级低、上面的卡还没解锁时，幸せな時間这类直接加好印象的卡也可以先拿。
    fallback: 攒好印象的卡拿不到时，多拿给好印象的メンタル卡凑数，晚一点再补。
  evidence:
    - {kind: guide, ref: game8 ロジックのプロデュース方法, url: "https://game8.jp/gakuen-idolmaster/609830", date: 2026-11-20}
    - {kind: ranking, mode: hajime, n: 2300, fetched: 2026-11-19, share: 0.95}
  updated: 2026-11-20
  by: bench

- id: hajime.style-review.card_pick.cash
  kind: written
  scope: {mode: hajime, style: review}
  decision: card_pick
  content:
    prefer:
      - {id: p_card-02-act-3_050, role: impression_cash, weight: 90, note: 輝くキミへ：之后每打一张卡按好印象的 50% 涨分；排行榜上多由回忆带入，回忆没带时培育中一定要拿}
      - {id: p_card-02-act-3_052, role: impression_cash, weight: 85, note: キセキの魔法：收尾大分}
      - {id: p_card-02-act-2_049, role: impression_cash, weight: 80, note: みんな大好き：带使用数 +1，P 等级高低都值得拿}
      - {id: p_card-02-act-2_046, role: impression_cash, weight: 65, note: ラブリーウインク}
      - {id: p_card-02-act-1_003, role: impression_cash, weight: 45, note: 手拍子：P 等级低时的替代}
    why: >-
      好印象攒起来以后（考试中后段），要有按当前好印象出分的主动卡把分收进来。
      輝くキミへ装上之后每打一张卡都按好印象涨分，是最该拿的一张；キセキの魔法留到最后收尾。
    unless:
      when: {deck_count: {ids: [p_card-02-act-3_050, p_card-02-act-3_052, p_card-02-act-2_049, p_card-02-act-2_046], gte: 4}}
      text: 牌组里已经有 4 张以上这类出分卡，再拿会挤掉攒好印象的卡
  evidence:
    - {kind: guide, ref: game8 ロジックのプロデュース方法, url: "https://game8.jp/gakuen-idolmaster/609830", date: 2026-11-20}
    - {kind: ranking, mode: hajime, n: 2300, fetched: 2026-11-19, share: 0.47}
  updated: 2026-11-20
  by: bench

- id: hajime.style-review.card_pick.yaruki-supply
  kind: written
  scope: {mode: hajime, style: review}
  decision: card_pick
  content:
    prefer:
      - {id: p_card-02-men-2_111, role: motivation, weight: 80, note: 成長痛}
      - {id: p_card-02-men-3_043, role: motivation, weight: 75, note: トキメキ：好印象 +8、やる気 +5}
      - {id: p_card-02-men-3_041, role: motivation, weight: 70, note: ノートの端の決意}
      - {id: p_card-02-men-2_054, role: motivation, weight: 65, note: 本番前夜：开局就在手里}
      - {id: p_card-02-men-2_004, role: motivation, weight: 60, note: ワクワクが止まらない}
    why: >-
      好印象这边有几张强卡（みんな大好き、オトメゴコロ、輝くキミへ、星屑センセーション）消耗的是やる気而不是体力。
      要顺手拿几张能补やる気的卡，免得关键回合やる気不够、牌打不出去。这里说的是「给やる気」的卡，
      不是靠元気出分的やる気流派卡，后者对好印象没用。
  evidence:
    - {kind: guide, ref: game8 ロジックのプロデュース方法, url: "https://game8.jp/gakuen-idolmaster/609830", date: 2026-11-20}
    - {kind: ranking, mode: hajime, n: 2300, fetched: 2026-11-19, share: 0.71}
  updated: 2026-11-20
  by: bench

- id: hajime.style-review.card_upgrade.core
  kind: written
  scope: {mode: hajime, style: review}
  decision: card_upgrade
  content:
    prefer:
      - {id: p_card-02-men-2_111, upgrade: 1, note: 成長痛一定要强化}
      - {id: p_card-02-act-3_050, custom: [p_card_custom-100-g_effect-p_card-02-act-3_050-enc_1], levels: 1, full: true, note: 輝くキミへ定制「持续效果」：按好印象涨分时再给好印象 +1}
      - {id: p_card-02-men-2_060, custom: [p_card_custom-070-g_effect-review_add-2], levels: 1, note: オトメゴコロ定制好印象 +2}
      - {id: p_card-02-act-2_046, custom: [p_card_custom-040_070-g_effect-lesson_depend_exam_review_add-350-g_effect-lesson_depend_exam_review_add-1150], levels: 2, note: ラブリーウインク定制按好印象出分}
    why: >-
      强化和定制先给循环里反复用的卡：成長痛不强化不划算；輝くキミへ、オトメゴコロ定制成多给好印象。
      ラブリーウインク在 P 等级低、出分卡少时是主力，定制按好印象出分的方向。
  evidence:
    - {kind: guide, ref: いおん10}
    - {kind: guide, ref: game8 HIF編ロジック（好印象）の育成攻略, url: "https://game8.jp/gakuen-idolmaster/784692", date: 2026-11-20}
    - {kind: ranking, mode: hajime, n: 2300, fetched: 2026-11-19}
  updated: 2026-11-20
  by: bench

