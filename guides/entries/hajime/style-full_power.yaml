- id: hajime.style-full_power.card_remove.basics
  kind: written
  scope:
    mode: hajime
    style: full_power
  decision: card_remove
  content:
    avoid:
    - class:basic
    - class:other_buff
    why: 相談里花 P 点删掉没用的卡，强卡更常进手牌。初的排行榜里基本卡大多留着，删得最多的是スピーチの基本（排行榜留存 76%）；同プラン里主打另一种 buff 的卡对这个流派没用。
