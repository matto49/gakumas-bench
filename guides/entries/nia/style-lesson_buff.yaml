- id: nia.style-lesson_buff.card_pick.loop
  kind: written
  scope:
    mode: nia
    style: lesson_buff
  decision: card_pick
  content:
    prefer:
    - id: p_card-01-men-2_037
      role: loop
      keep: 1
    - id: p_card-01-act-2_001
      role: loop
      keep: 1
    - id: p_card-01-act-3_185
      role: loop
      keep: 1
    why: N.I.A MASTER 的决赛靠最后几回合反复打同几张卡：不带「レッスン中1回」的卡只留循环件，其余都拿用一次就除外的卡。センス的循环一般是脚光发动后，用存在感和シュプレヒコール反复打。循环件最好用回忆带进来。
    unless:
      when:
        deck_count:
          ids:
          - p_card-01-men-2_037
          - p_card-01-act-2_001
          - p_card-01-act-3_185
          gte: 3
      text: 循环件已经齐了，同名卡不用再拿
  evidence:
