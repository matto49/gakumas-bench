      - {id: p_card-02-ido-3_015, role: idol, note: 早打，把好印象拉到 6 以上}
    why: >-
      固有道具ピッグドリーム貯金箱：打完一张卡时好印象 ≥6，就再给好印象 +3 和使用数 +1（每节课一次）。
      所以考试开局先打よそ見はダメ♪（好印象 +7）把好印象拉过 6，后面那张卡就能多打一张。
      评价里也有人提到：好印象卡没凑齐、P 等级不高时这张卡很难出分。
