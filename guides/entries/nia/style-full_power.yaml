- id: nia.style-full_power.card_pick.loop
  kind: written
  scope:
    mode: nia
    style: full_power
  decision: card_pick
  content:
    prefer:
    - id: p_card-03-act-3_053
      role: loop
      keep: 1
    - id: p_card-03-act-3_189
      role: loop
      keep: 1
    why: N.I.A MASTER 的决赛靠最后几回合反复打同几张卡：不带「レッスン中1回」的卡只留循环件，其余都拿用一次就除外的卡。全力的循环件 game8 给的是輝け！（定制成去掉次数限制）和羽ばたけ！。循环件最好用回忆带进来。
    unless:
      when:
        deck_count:
          ids:
          - p_card-03-act-3_053
          - p_card-03-act-3_189
          gte: 2
      text: 循环件已经齐了，同名卡不用再拿
  evidence:
