  content:
    prefer:
    - id: p_card-03-act-1_042
      role: loop
      weight: 95
      note: 攒全力值和全力回合出分两头都管，还能用好几次
    - id: p_card-03-men-2_103
      role: stance
      weight: 85
    - id: p_card-03-men-3_063
      role: stance
      weight: 85
    - id: p_card-03-act-1_073
      role: stance
      weight: 75
    - id: p_card-03-men-2_075
      role: stance
      weight: 65
      note: P 等级低时的替代
    - id: p_card-03-men-2_066
      role: stance
      weight: 65
    why: 全力流派要先攒「全力值」：攒到 10 以上，下一回合开始就进入「全力」，涨分大幅提高、还能多打一张卡。攒全力值的回合和全力出分的回合分开打；攒的时候顺便进温存，进入全力时能打的卡更多。積み重ね既能攒全力值、又能在全力回合出分，还能用好几次，P 等级高低都值得拿。
