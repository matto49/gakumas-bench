      role: loop
      keep: 1
    why: N.I.A MASTER 的决赛靠最后几回合反复打同几张卡：不带「レッスン中1回」的卡只留循环件，其余都拿用一次就除外的卡。やる気的出分卡和 buff 卡作用不同，形不成完全的循环，ゆめみごこち + きらきら紙吹雪 是 game8 给的例子。循环件最好用回忆带进来。
